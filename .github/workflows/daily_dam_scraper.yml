name: Daily Maharashtra 5-Dam Data Collector

on:
  schedule:
    # Runs daily at 09:00 AM IST (03:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-scraper-and-sync-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies & Python Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pandas mysql-connector-python pypdf pdfplumber

      - name: Fetch Dam Data & Sync to Cloud MySQL
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
        run: |
          python3 -c "
          import sys, os
          sys.path.append('scraper')
          sys.path.append('database')
          import fetch_dam_data
          import db_manager

          # 1. Fetch recent 3 days data to ensure no missing reports
          df = fetch_dam_data.fetch_multi_dam_data(days=3)
          
          # 2. Ingest into SQLite DBMS & export web JSON
          fetch_dam_data.save_to_files(df)

          # 3. Sync to Cloud MySQL tables if credentials are set
          mysql_host = os.environ.get('MYSQL_HOST')
          if mysql_host and mysql_host.strip():
              try:
                  fetch_dam_data.push_to_mysql(
                      df,
                      host=mysql_host.strip(),
                      user=os.environ.get('MYSQL_USER', 'avnadmin').strip(),
                      password=os.environ.get('MYSQL_PASSWORD', '').strip(),
                      database='defaultdb',
                      port=int(os.environ.get('MYSQL_PORT', 19180))
                  )
              except Exception as e:
                  print('[!] Note: MySQL Sync warning:', e)
          else:
              print('[!] MYSQL_HOST secret not set. Skipping DB sync.')
          "

      - name: Ingest to SQLite DBMS & Regenerate Dashboard JSON
        run: |
          python3 database/db_manager.py

      - name: Commit and Push Updated Database & Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/pune_dams.db web/dam_data.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update dam storage records, SQLite DB & dashboard JSON [$(date +'%Y-%m-%d')]"
            git push
          fi

