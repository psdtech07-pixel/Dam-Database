name: Daily Maharashtra Dam Storage Tracker

on:
  schedule:
    # Runs daily at 09:00 AM IST (03:30 AM UTC) & 03:00 PM IST (09:30 AM UTC)
    - cron: '30 3 * * *'
    - cron: '30 9 * * *'
  workflow_dispatch: # Allows manual run anytime

permissions:
  contents: write

jobs:
  scrape-and-update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Utilities & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install pandas pypdf pdfplumber schedule

      - name: Execute Daily Dam Storage Scraper & Database Ingestion
        run: |
          python3 scraper/daily_dam_worker.py --once --days 5

      - name: Commit & Publish Updated Data Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/ database/pune_dams.db || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update Maharashtra dam storage records [$(date +'%Y-%m-%d')]"
            git push
          fi
