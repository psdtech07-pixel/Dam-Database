name: Historical Dam Bulletin Backfill & Database Sync

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of historical days to check and download PDFs (default: 365)'
        required: false
        default: '365'

concurrency:
  group: dam-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill-pdfs-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies & Python Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r requirements.txt pdfplumber schedule

      - name: Run Historical PDF Downloader & Ingestion
        run: |
          days=${{ github.event.inputs.days || 365 }}
          echo "🚀 Starting backfill for past $days days..."
          python3 scraper/daily_dam_worker.py --once --days "$days"

      - name: Run Automated Tests & Data Audit
        run: |
          pytest -q
          python3 scripts/audit_data.py

      - name: Commit and Push Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add web/data/ database/pune_dams.db
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Historical backfill WRD PDFs, SQLite DB & web JSON [$(date +'%Y-%m-%d')]"
            git push
          fi
