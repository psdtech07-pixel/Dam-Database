<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Reservoir Details...</title>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get('slug') || params.get('id') || params.get('dam');
      if (slug) {
        window.location.replace('index.html#/dam/' + encodeURIComponent(slug));
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 40px; text-align: center; color: #475569;">
  <p>Redirecting to <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: 500;">Maharashtra Dam Water Levels Dashboard</a>...</p>
</body>
</html>
